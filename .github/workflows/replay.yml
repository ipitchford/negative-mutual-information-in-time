# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  quick:
    name: Manifest; exact verifier under python -O compared with the recorded output; negative controls (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Install pinned requirements of the exact verifier
        run: python3 -m pip install --disable-pip-version-check sympy==1.14.0 mpmath==1.3.0
      - name: Run the verifier under -O in a copy; run the negative controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pkg="$RUNNER_TEMP/pkg"; n1="$RUNNER_TEMP/neg1"; n2="$RUNNER_TEMP/neg2"
          for d in "$pkg" "$n1" "$n2"; do mkdir -p "$d"; cp -R verification "$d/verification"; done
          test "$(grep -c 'num, den = 5\*\*5\*7\*\*7, ' "$n1/verification/verify_qutrit.py")" = 1
          sed -i 's|num, den = 5\*\*5\*7\*\*7, |num, den = 5**6*7**7, |' "$n1/verification/verify_qutrit.py"
          test "$(grep -c 'hi_x < sp.Rational("-0.00139052762357143")' "$n2/verification/verify_qutrit.py")" = 1
          sed -i 's|hi_x < sp.Rational("-0.00139052762357143")|hi_x < sp.Rational("-0.00139052762357150")|' "$n2/verification/verify_qutrit.py"
          cd "$pkg" && python3 -I -B -O verification/verify_qutrit.py > verification.out.json
          cd "$n1"; if python3 -I -B -O verification/verify_qutrit.py > /dev/null; then echo "negative control 1 not detected"; exit 1; fi
          cd "$n2"; if python3 -I -B -O verification/verify_qutrit.py > /dev/null; then echo "negative control 2 not detected"; exit 1; fi
      - name: Compare with the recorded output (exact)
        run: |
          # Every field of verification.json is an exact string (rationals, factored polynomials, outward-rounded
          # interval endpoints, decimal expansions from 30-60 digit arithmetic) or a boolean: compared byte for byte.
          cmp "$RUNNER_TEMP/pkg/verification.out.json" verification/verification.json
          grep -q '"all_checks_passed": true' verification/verification.json
          grep -q '"inequality": "2573571875 < 8707129344"' verification/verification.json
          echo "PASS: verifier output identical to verification/verification.json; both negative controls detected"
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
  numerics:
    name: "Descriptive numerics, quoted values compared with the recorded output within a declared tolerance (non-blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Run numerics.py and compare
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B verification/numerics.py > "$RUNNER_TEMP/numerics.json"
          python3 -I - "$RUNNER_TEMP/numerics.json" verification/numerics.json <<'PY'
          import json, math, sys
          # Declared policy (also in README.md, ENVIRONMENT.txt and REPLAY_RECEIPT.md). The values quoted in Section 8 of
          # the paper are compared within 1e-6 (relative or absolute); integer counts exactly. The best values found by the
          # other multistart searches (3->3 with 9 Kraus operators; unconstrained 3->2) and the structured search's
          # minimiser coordinates are not quoted: random-start local optimisation lands in different local minima across
          # platforms and BLAS builds, so they are reported, and only the paper's claim that nothing lower than the
          # family minimum was found is checked for them (minimiser coordinates within 1e-4).
          new, old = (json.load(open(p)) for p in sys.argv[1:3])
          close = lambda a, b, tol=1e-6: math.isclose(a, b, rel_tol=tol, abs_tol=tol)
          u, U = new["unconstrained_minimum_found"], old["unconstrained_minimum_found"]
          quoted = "3->3, Kraus rank 3, seed 3, 25 starts"
          bad = []
          if set(u) != set(U): bad.append("search keys")
          if not close(u[quoted], U[quoted]): bad.append(quoted)
          floor = U[quoted] - 1e-6
          for k, v in u.items():
              print("search", k, "found", v, "recorded", U[k])
              if v < floor: bad.append("lower than the family minimum: " + k)
          s, S = new["structured_3to2_minimum_found"], old["structured_3to2_minimum_found"]
          if not close(s["I"], S["I"]): bad.append("structured I")
          if not all(math.isclose(a, b, abs_tol=1e-4) for a, b in zip(s["input_diag"], S["input_diag"])): bad.append("structured minimiser")
          if set(new["tensor_powers_at_t_star"]) != set(old["tensor_powers_at_t_star"]) or not all(close(new["tensor_powers_at_t_star"][k], v) for k, v in old["tensor_powers_at_t_star"].items()): bad.append("tensor powers")
          if abs(new["pure_input_random_minimum"]) > 1e-9: bad.append("pure inputs")
          if new["random_rank_two_qutrit_processes"] != old["random_rank_two_qutrit_processes"]: bad.append("random rank-two sample")
          if bad: raise SystemExit(f"differs beyond the declared policy: {bad}")
          print("PASS: quoted numerics agree with verification/numerics.json within the declared tolerance; nothing below the family minimum")
          PY
